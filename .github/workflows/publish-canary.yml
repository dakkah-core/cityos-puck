name: Publish canary release
on:
  push:
    branches:
      - "main"
      - "releases/**"

permissions:
  contents: read
  id-token: write

jobs:
  tag-and-publish-to-npm:
    runs-on: ubuntu-latest

    # Keep upstream automatic publishing out of the CityOS fork's source workflow.
    # CityOS package publication uses publish-cityos.yml via explicit workflow_dispatch.
    if: "github.repository == 'puckeditor/puck' && !startsWith(github.event.head_commit.message, 'release: ')"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Check canonical toolchain projections
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/project-toolchain.mjs --check
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/run-pinned-pnpm.mjs install

      - name: Run release script
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/run-pinned-pnpm.mjs release:canary

      - name: Publish all packages
        run: ./scripts/publish.sh canary

    timeout-minutes: 10
