name: Qualify CityOS Puck package

on:
  workflow_dispatch:
    inputs:
      cms_commit:
        description: Exact authoritative CMS/Studio consumer commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  qualify:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check canonical toolchain projections
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/project-toolchain.mjs --check
      - name: Check out the pinned CMS/Studio source from its canonical origin
        shell: bash
        env:
          CMS_COMMIT: ${{ inputs.cms_commit }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          source scripts/toolchains/select-workspace-node.sh
          [[ "$CMS_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::An exact CMS/Studio commit is required.'; exit 1; }
          cms_repository="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("config/upstream/integration.json", "utf8")).consumerRepository)')"
          git init .build/cms-host
          git -C .build/cms-host remote add origin "$cms_repository"
          git -c credential.helper= -C .build/cms-host fetch --no-tags --depth=1 origin "$CMS_COMMIT"
          git -C .build/cms-host checkout --detach FETCH_HEAD
          [[ "$(git -C .build/cms-host rev-parse HEAD)" == "$CMS_COMMIT" ]]
      - name: Install native pnpm
        id: pnpm
        uses: pnpm/setup@v3
        with:
          install: false
          node-version-file: false
      - name: Bind and verify the native manager
        shell: bash
        env:
          PNPM_BIN_DEST: ${{ steps.pnpm.outputs.bin-dest }}
        run: |
          source scripts/toolchains/select-workspace-node.sh
          export PUCK_PNPM_EXECUTABLE="$PNPM_BIN_DEST/pnpm"
          node scripts/toolchains/run-pinned-pnpm.mjs --version
          printf 'PUCK_PNPM_EXECUTABLE=%s\n' "$PUCK_PNPM_EXECUTABLE" >> "$GITHUB_ENV"
      - name: Install the frozen dependency graph
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/run-pinned-pnpm.mjs install --frozen-lockfile
      - name: Qualify the exact source and packed distribution
        env:
          CMS_COMMIT: ${{ inputs.cms_commit }}
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          (
            cd .build/cms-host
            source scripts/toolchains/select-workspace-node.sh
            node scripts/toolchains/run-pinned-pnpm.mjs install --frozen-lockfile --ignore-scripts
          )
          node scripts/upstream/qualification.mjs --cms-root .build/cms-host --cms-commit "$CMS_COMMIT"
      - name: Preserve the qualified tarball, receipt and executed-check logs
        uses: actions/upload-artifact@v6
        with:
          name: cityos-puck-qualified-${{ github.sha }}
          path: .build/upstream/qualified/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cityos-puck-qualification-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .build/upstream/qualification-*/*.log
            .build/upstream/qualification-*/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
