name: Publish CityOS Puck package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Check canonical toolchain projections
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/project-toolchain.mjs --check
      - uses: pnpm/action-setup@v4
      - run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/run-pinned-pnpm.mjs install --frozen-lockfile
      - run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/run-pinned-pnpm.mjs --filter @cityos-core/puck build
      - working-directory: packages/core
        run: |
          source "$GITHUB_WORKSPACE/scripts/toolchains/select-workspace-node.sh"
          npm publish --access public --tag cityos --provenance --ignore-scripts
