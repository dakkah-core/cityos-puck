name: Publish CityOS Puck package

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Actions run containing the SHA-bound qualified tarball, receipt and executed-check logs
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Check canonical toolchain projections
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/project-toolchain.mjs --check
      - name: Download the qualified distribution without rebuilding it
        uses: actions/download-artifact@v4
        with:
          name: cityos-puck-qualified-${{ github.sha }}
          path: .build/upstream/qualified
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source, lockfile, required checks, logs and exact tarball bytes
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/upstream/integration.mjs --receipt .build/upstream/qualified/receipt.json
          node scripts/upstream/publication-input.mjs .build/upstream/qualified/receipt.json
      - name: Publish the same qualified tarball
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          npm publish "$GITHUB_WORKSPACE/.build/upstream/qualified/package.tgz" --access public --tag cityos --provenance --ignore-scripts
