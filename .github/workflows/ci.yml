# This workflow runs the complete maintained checks without reducing their scope.
name: Build and Test ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  cityos-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check canonical toolchain projections
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/project-toolchain.mjs --check
      - name: Verify data-only registration and revocation
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          mkdir -p .build/cityos-registration
          node scripts/cityos/registration-source-suite.mjs | tee .build/cityos-registration/results.tap
      - name: Check registration formatting with pinned tool
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          prettier_version="$(node scripts/toolchains/catalog-version.mjs prettier)"
          npm install --prefix "$RUNNER_TEMP/cityos-format" --ignore-scripts --no-audit --no-fund "prettier@$prettier_version"
          node scripts/cityos/check-registration-format.mjs "$RUNNER_TEMP/cityos-format"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cityos-registration-${{ github.sha }}
          path: .build/cityos-registration/
          retention-days: 7
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check canonical toolchain projections
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          node scripts/toolchains/project-toolchain.mjs --check
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Record exact verification inputs
        shell: bash
        run: |
          source scripts/toolchains/select-workspace-node.sh
          bash -n .github/scripts/run-recorded-check.sh
          mkdir -p .build/cityos-ci
          git rev-parse HEAD > .build/cityos-ci/source-sha.txt
          sha256sum pnpm-lock.yaml packages/core/package.json packages/core/cityos.ts packages/core/cityos-registration.ts packages/core/tsup.config.ts apps/demo/tsconfig.json .github/workflows/ci.yml .github/scripts/run-recorded-check.sh > .build/cityos-ci/input-sha256.txt
          sha256sum package.json pnpm-workspace.yaml .pnpmfile.cjs config/dependencies/tooling-api.json config/toolchains/node-typescript.json scripts/toolchains/read-default-catalog.cjs scripts/toolchains/tooling-api.cjs scripts/toolchains/installed-compatibility.test.mjs packages/eslint-config-custom/package.json packages/eslint-config-custom/index.mjs >> .build/cityos-ci/input-sha256.txt
          node --version > .build/cityos-ci/node-version.txt
          node scripts/toolchains/run-pinned-pnpm.mjs --version > .build/cityos-ci/pnpm-version.txt
      - name: Install dependencies
        run: bash .github/scripts/run-recorded-check.sh install
      - name: Verify installed compiler and lint compatibility
        run: bash .github/scripts/run-recorded-check.sh compatibility
      - name: Run tests
        run: bash .github/scripts/run-recorded-check.sh test
      - name: Check linting and formatting
        run: |
          bash .github/scripts/run-recorded-check.sh lint
          bash .github/scripts/run-recorded-check.sh format
      - name: Build everything
        run: bash .github/scripts/run-recorded-check.sh build
      - name: Preserve exact verification output, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cityos-full-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: .build/cityos-ci/
          retention-days: 7
