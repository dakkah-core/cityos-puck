# This workflow runs the complete maintained checks without reducing their scope.
name: Build and Test ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  cityos-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify data-only registration and revocation
        shell: bash
        run: |
          mkdir -p .build/cityos-registration
          node --experimental-strip-types --test scripts/cityos/*.test.mjs | tee .build/cityos-registration/results.tap
      - name: Check registration formatting with pinned tool
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/cityos-format" --ignore-scripts --no-audit --no-fund prettier@2.8.8
          node scripts/cityos/check-registration-format.mjs "$RUNNER_TEMP/cityos-format"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cityos-registration-${{ github.sha }}
          path: .build/cityos-registration/
          retention-days: 7
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Record exact verification inputs
        shell: bash
        run: |
          bash -n .github/scripts/run-recorded-check.sh
          mkdir -p .build/cityos-ci
          git rev-parse HEAD > .build/cityos-ci/source-sha.txt
          sha256sum pnpm-lock.yaml packages/core/package.json packages/core/cityos.ts packages/core/cityos-registration.ts packages/core/tsup.config.ts apps/demo/tsconfig.json .github/workflows/ci.yml .github/scripts/run-recorded-check.sh > .build/cityos-ci/input-sha256.txt
          node --version > .build/cityos-ci/node-version.txt
          pnpm --version > .build/cityos-ci/pnpm-version.txt
      - name: Install dependencies
        run: bash .github/scripts/run-recorded-check.sh install
      - name: Run tests
        run: bash .github/scripts/run-recorded-check.sh test
      - name: Check linting and formatting
        run: |
          bash .github/scripts/run-recorded-check.sh lint
          bash .github/scripts/run-recorded-check.sh format
      - name: Build everything
        run: bash .github/scripts/run-recorded-check.sh build
      - name: Preserve exact verification output, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cityos-full-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: .build/cityos-ci/
          retention-days: 7
